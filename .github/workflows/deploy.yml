name: Deploy

# main  -> staging (stg.brisasoft.net), automatic
# tag v* or manual run -> production (brisasoft.net), after approval in the "production" environment
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Deploy to staging
        run: npm run deploy:stg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test staging
        run: |
          for p in / /en/ /ja/ /vi/ /en/products/bis/ /en/about/founder/ /ja/about/founder/ /en/privacy/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://stg.brisasoft.net$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done

  production:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers in GitHub (Settings > Environments)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Deploy to production
        run: npm run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production
        run: |
          for p in / /en/ /ja/ /vi/ /en/products/bis/ /en/about/founder/ /ja/about/founder/ /en/privacy/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://brisasoft.net$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
