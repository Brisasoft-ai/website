<section class="hero small">
  <div class="wrap">
    <span class="eyebrow">{{contact.eyebrow}}</span>
    <h1>{{contact.title}}</h1>
    <p>{{contact.text}}</p>
  </div>
</section>

<section class="alt">
  <div class="wrap">
    <div class="cta-box">
      <span class="eyebrow">{{contact.emailLabel}}</span>
      <h2 class="section-title"><a class="mail-link" href="mailto:{{@email}}">{{@email}}</a></h2>
      <p class="section-sub">{{facts.companyValue}} · {{facts.locationValue}}</p>
      <a href="{{@mailto}}" class="btn btn-primary">{{cta.sendEmail}}</a>
      <div class="include">
        <h3>{{contact.include.title}}</h3>
        <ul class="bullets">
          <li>{{contact.include.i1}}</li>
          <li>{{contact.include.i2}}</li>
          <li>{{contact.include.i3}}</li>
          <li>{{contact.include.i4}}</li>
        </ul>
      </div>
    </div>
  </div>
</section>
